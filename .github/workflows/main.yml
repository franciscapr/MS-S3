
name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el codigo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Iniciar sesion en Docker Hub
      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Construir imagen Docker
      - name: Build Docker Image
        run: docker build -t franciscaparedespr/my-app:latest .

      # 4. Publicar imagen Docker
      - name: Push Docker Image
        run: docker push franciscaparedespr/my-app:latest

      # 5. Configurar clave SSH
      - name: Add SSH Key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      # 6. Desplegar automaticamente en EC2
      - name: SSH commands to deploy
        env:
          USER_SERVER: ${{ secrets.USER_SERVER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER_SERVER@$EC2_HOST" << 'EOF'
          set -e

          # Comprobar que EFS esta montado
          mountpoint -q /home/ec2-user/efs || {
            echo "ERROR: Amazon EFS no esta montado"
            exit 1
          }

          # Comprobar la carpeta de tickets
          test -d /home/ec2-user/efs/tickets || {
            echo "ERROR: No existe la carpeta tickets"
            exit 1
          }

          # Comprobar permisos de escritura
          test -w /home/ec2-user/efs/tickets || {
            echo "ERROR: No hay permisos de escritura en EFS"
            exit 1
          }

          # Descargar nueva imagen desde Docker Hub
          docker pull franciscaparedespr/my-app:latest

          # Detener y eliminar el contenedor anterior
          docker stop my-app || true
          docker rm my-app || true

          # Crear contenedor con EFS montado
          docker run -d \
            --name my-app \
            --restart unless-stopped \
            -p 8080:8080 \
            --mount type=bind,source=/home/ec2-user/efs/tickets,target=/app/efs \
            franciscaparedespr/my-app:latest

          # Verificar montaje
          docker inspect my-app --format '{{json .Mounts}}'
          EOF
